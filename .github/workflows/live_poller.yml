name: Pixel Pros Background Sports Poller

on:
  # 1. Scheduled Cron: Runs every 10 minutes during game windows (Sundays, Mondays, Thursdays)
  schedule:
    - cron: '*/10 17-23 * * 0,1,4'
  # 2. Manual Trigger: Allows instantaneous trigger from GitHub web UI
  workflow_dispatch:
    inputs:
      cycles:
        description: 'Number of poller cycles to run'
        required: false
        default: '5'

jobs:
  poll-and-sync:
    name: Poll Live Sports & Push to Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Whole-Number Scoring Test
        run: |
          python scripts/poller.py --test

      - name: Execute Live Sports Poller
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          POLL_INTERVAL: 30
        run: |
          # If triggered manually, run specified cycles; otherwise run a live sync pass
          python scripts/poller.py --once
